# OpenFirePower's CI: every build, its tests, and whether they all compute the same game.
# Each build writes its rules fingerprint (docs/TESTING.md) to rules-NAME.txt; the last job
# compares them, so a compiler or platform that computes differently fails the pipeline.
# The fingerprint covers standard matches only: so each build also plays the replay fixtures
# (tests/replays, recorded by GCC on Linux, arenas among them): clang (as macOS builds), the
# WebAssembly core (the replay viewer). Replay checksums must match across builds.
# The 68k core also has a compile-only portability check.
stages: [build, compare]

variables:
  DEBIAN_FRONTEND: noninteractive

.ubuntu: &ubuntu
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential cmake pkg-config libsdl2-dev libsqlite3-dev libcurl4-openssl-dev > /dev/null

linux-gcc:
  <<: *ubuntu
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j"$(nproc)"
    - SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ctest --test-dir build --output-on-failure
    - build/ofp_server --version | tee rules-linux-gcc.txt
  artifacts: { paths: [rules-linux-gcc.txt], expire_in: 1 week }

linux-clang:
  <<: *ubuntu
  stage: build
  script:
    - apt-get install -y -qq clang > /dev/null
    - CC=clang cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFP_BUILD_SDL2=OFF
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure -R "same_game|net|fuzz"
    - build/ofp_server --version | tee rules-linux-clang.txt
  artifacts: { paths: [rules-linux-clang.txt], expire_in: 1 week }

windows-mingw:
  <<: *ubuntu
  stage: build
  script:
    - apt-get install -y -qq mingw-w64 curl python3 wine64 > /dev/null
    - WORK=build-windows OFP_BUILD_DIR=build-windows OFP_PACKAGE_DIR=build-windows sh tools/package_windows.sh
    - WINEDEBUG=-all wine64 build-windows/OpenFirePower/openfirepower.exe --version | tr -d '\r' | tee rules-windows.txt
  artifacts:
    paths: [rules-windows.txt, build-windows/*.zip, build-windows/*.sha256]
    expire_in: 1 month

webassembly:
  <<: *ubuntu
  stage: build
  script:
    - apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32 nodejs > /dev/null
    - tools/build_web.sh
    - node tools/rules_wasm.js | tee rules-webassembly.txt
    - node tools/replays_wasm.js tests/replays/*.ofprep        # (the replay viewer plays them as the server did)
  artifacts: { paths: [rules-webassembly.txt, public-website/assets/ofp.wasm], expire_in: 1 week }

# Compile-only portability check; run native replay tests on the target Amiga.
amiga-core-cross-build:
  <<: *ubuntu
  stage: build
  script:
    - apt-get install -y -qq gcc-m68k-linux-gnu > /dev/null
    - m68k-linux-gnu-gcc -std=c99 -O2 -m68040 -DOFP_MAP_MAX=192 -Wall -Wextra -Isrc -static -o ofp_match_68k
        src/core/*.c src/common/replay.c src/common/dump.c src/tools/ofp_match.c

# address and undefined-behaviour checks: the network code, the fuzzers (packets, maps, replays) for longer
# than the quick runs above; they found real bugs the first time they ran this way
sanitizers:
  <<: *ubuntu
  stage: build
  variables:
    ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
    UBSAN_OPTIONS: "print_stacktrace=1"
  script:
    - cmake -S . -B build-san -DOFP_FUZZ=ON -DOFP_BUILD_SDL2=OFF -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build-san -j"$(nproc)"
    - build-san/fuzz_net 200000 "$CI_PIPELINE_IID"
    - build-san/fuzz_files 20000 "$CI_PIPELINE_IID"
    - ctest --test-dir build-san --output-on-failure -R "^net$|same_game|core|match_verify"

# (a macOS runner, if there is one: tag it "macos")
macos:
  stage: build
  tags: [macos]
  rules:
    - if: $MACOS_RUNNER
  script:
    - WORK=build-macos OFP_BUILD_DIR=build-macos OFP_PACKAGE_DIR=build-macos sh tools/package_macos.sh
    - build-macos/OpenFirePower.app/Contents/MacOS/openfirepower --version | tee rules-macos.txt
  artifacts: { paths: [rules-macos.txt, build-macos/*.dmg, build-macos/*.zip, build-macos/*.sha256], expire_in: 1 month }

same-rules-everywhere:
  image: alpine:3.20
  stage: compare
  needs:
    - linux-gcc
    - linux-clang
    - windows-mingw
    - webassembly
    - amiga-core-cross-build
    - { job: macos, optional: true }
  script:
    - tools/compare_rules.sh rules-*.txt

# Publication is exclusively through scripts/release.py and a reviewed manifest.
# Pushing a release tag runs checks, but never creates releases or uploads packages.
release-tool-tests:
  image: python:3.9-bullseye
  stage: build
  script:
    - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_release*.py'

website-checks:
  image: php:8.2-cli
  stage: build
  script:
    - find public-website -name '*.php' -print0 | xargs -0 -n1 php -l
    - php tests/test_website_releases.php
