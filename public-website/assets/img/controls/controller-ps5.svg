<text x="675" y="204" fill="#fcfaf4" font-size="17" font-weight="600" text-anchor="middle">R2</text>
<!-- Continuous, gently curved outer silhouette with full rounded grips. -->
<path d="M294 218 C334 201 377 198 414 204 Q500 194 586 204 C623 198 666 201 706 218 C747 237 767 294 781 358 C796 426 804 504 785 554 C778 575 764 589 748 585 C723 579 708 551 690 515 L650 439 Q637 416 612 425 H388 Q363 416 350 439 L310 515 C292 551 277 579 252 585 C236 589 222 575 215 554 C196 504 204 426 219 358 C233 294 253 237 294 218Z" fill="url(#shell)" class="shell"/>
