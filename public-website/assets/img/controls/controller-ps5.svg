<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: MIT -->
<title id="title">PlayStation 5 DualSense controller</title>
<desc id="desc">A white DualSense controller with rounded grips, a black centre, a broad touchpad, symmetrical analogue sticks and grey PlayStation symbol buttons. Six numbered callouts outside the controller show the default OpenFP controls.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.shell{stroke:#363d3a;stroke-width:2.5;stroke-linejoin:round}.wire{fill:none;stroke:#ad381d;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style>
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fff"/><stop offset=".6" stop-color="#edf0ed"/><stop offset="1" stop-color="#d5dbd7"/></linearGradient>
 <linearGradient id="centre" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#363b3e"/><stop offset="1" stop-color="#202528"/></linearGradient>
 <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fafbfc"/><stop offset="1" stop-color="#dfe3e9"/></linearGradient>
 <radialGradient id="stick"><stop offset=".65" stop-color="#32393c"/><stop offset="1" stop-color="#1f2629"/></radialGradient>
</defs>
<rect width="1000" height="720" rx="12" fill="#eeede3"/>
<path d="M40 680H960" stroke="#d3d4c7"/>
<text x="40" y="703" fill="#60675d" font-size="14" letter-spacing="2">OPENFP / DEFAULT CONTROLS</text>
